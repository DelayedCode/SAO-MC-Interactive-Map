      {
        "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "Fractured Underworld Tower Defense Guide",
        "url": "https://delayedcode.github.io/SAO-MC-Interactive-Map/Fractured%20Underworld/Tower%20Defense/towerdefense.html",
        "description": "Tower Defense reference page for SAO MC Fractured Underworld chapters and shop.",
        "isPartOf": {
          "@type": "WebSite",
          "name": "SAO MC Interactive Map",
          "url": "https://delayedcode.github.io/SAO-MC-Interactive-Map/"
        },

      }
    </script>

  </head>
  <body>
    <header>
      <div class="header-main">
        <p class="eyebrow" data-i18n="page.towerdefense.eyebrow">FRACTURED UNDERWORLD / TOWER DEFENSE</p>
        <h1 data-i18n="page.towerdefense.heading">Fractured Underworld Tower Defense</h1>
        <a
          id="towerDefenseBackButton"
          class="header-back-button"
          href="../Main UI/mainui.html"
          data-i18n="page.towerdefense.back"
          >Go back</a
        >
      </div>
    </header>

    <main>
      <section
        class="layout-grid"
        data-i18n-aria-label="page.towerdefense.sectionsAria"
        aria-label="Tower Defense sections"
      >
        <div class="layout-left">
          <section
            class="intro-card chapter-card"
            data-i18n-aria-label="page.towerdefense.chapterOverviewAria"
            aria-label="Tower Defense chapter overview"
          >
            <div class="section-heading">
              <div>
                <p class="section-eyebrow" data-i18n="page.towerdefense.sectionEyebrow">Tower Defense</p>
                <h2 data-i18n="page.towerdefense.chapterSelect">Chapter Select</h2>
              </div>
              <span class="section-count">6</span>
            </div>
            <div
              class="shop-list chapter-list"
              data-i18n-aria-label="page.towerdefense.chapterListAria"
              aria-label="Tower Defense chapter list"
            >
              <button
                class="chapter-button is-active"
                type="button"
                data-open-info-sheet="true"
                data-chapter="1"
                aria-haspopup="dialog"
                aria-controls="towerDefenseInfoSheet"
                aria-pressed="true"
              ></button>
              <button
                class="chapter-button"
                type="button"
                data-open-info-sheet="true"
                data-chapter="2"
                aria-haspopup="dialog"
                aria-controls="towerDefenseInfoSheet"
                aria-pressed="false"
              ></button>
              <button
                class="chapter-button"
                type="button"
                data-open-info-sheet="true"
                data-chapter="3"
                aria-haspopup="dialog"
                aria-controls="towerDefenseInfoSheet"
                aria-pressed="false"
              ></button>
              <button
                class="chapter-button"
                type="button"
                data-open-info-sheet="true"
                data-chapter="4"
                aria-haspopup="dialog"
                aria-controls="towerDefenseInfoSheet"
                aria-pressed="false"
              ></button>
              <button
                class="chapter-button"
                type="button"
                data-open-info-sheet="true"
                data-chapter="5"
                aria-haspopup="dialog"
                aria-controls="towerDefenseInfoSheet"
                aria-pressed="false"
              ></button>
              <button
                class="chapter-button"
                type="button"
                data-open-info-sheet="true"
                data-chapter="6"
                aria-haspopup="dialog"
                aria-controls="towerDefenseInfoSheet"
                aria-pressed="false"
              ></button>
            </div>
          </section>
        </div>

        <aside
          class="layout-right"
          data-i18n-aria-label="page.towerdefense.shopSectionAria"
          aria-label="Tower Defense shop section"
        >
          <section class="intro-card shop-card">
            <div class="section-heading">
              <div>
                <p class="section-eyebrow" data-i18n="page.towerdefense.progressionEyebrow">Progression</p>
                <h2 data-i18n="page.towerdefense.shopTitle">Tower Defense Shop</h2>
              </div>
              <span class="section-count" id="towerDefenseShopCount">0</span>
            </div>
            <div
              id="towerDefenseShopList"
              class="shop-list"
              data-i18n-aria-label="page.towerdefense.shopListAria"
              aria-label="Tower Defense shop list"
            ></div>
          </section>
        </aside>
      </section>
    </main>

    <div id="towerDefenseInfoSheet" class="info-sheet" aria-hidden="true">
      <div class="info-sheet-backdrop" data-close-info-sheet="true"></div>
      <section class="info-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="infoSheetTitle">
        <header class="info-sheet-header">
          <div>
            <p class="section-eyebrow" data-i18n="page.towerdefense.chapterInformation">Chapter information</p>
            <h2 id="infoSheetTitle" data-i18n="page.towerdefense.infoSheetTitle">Tower Defense Info Sheet</h2>
          </div>
          <button
            id="closeInfoSheetButton"
            class="close-button"
            type="button"
            data-i18n-aria-label="page.towerdefense.closeInfoSheet"
            aria-label="Close info sheet"
            data-i18n="ui.settings.closeLabel"
          >
            Close
          </button>
        </header>

        <div id="towerDefenseInfoSheetContent" class="info-sheet-content"></div>
      </section>
    </div>

    <div
      id="towerDefenseToast"
      class="global-toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      aria-hidden="true"
    ></div>
