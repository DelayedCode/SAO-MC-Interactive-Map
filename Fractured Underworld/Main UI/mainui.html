  </head>
  <body>
    <header>
      <nav class="top-nav" data-i18n-aria-label="ui.nav.primaryAria" aria-label="Primary">
        <button class="top-button" type="button" data-nav-target="towerDefense" data-i18n="page.mainui.towerDefenseNav">
          Tower Defense
        </button>
        <button class="top-button" type="button" data-nav-target="compendium" data-i18n="page.mainui.compendiumNav">
          Compendium
        </button>
        <button class="top-button" type="button" data-nav-target="menu" data-i18n="ui.nav.menu">Go back to Menu</button>
      </nav>
      <div class="island-nav" id="islandNav" data-i18n-aria-label="ui.nav.islandAria" aria-label="Island navigation">
        <button
          class="island-nav-button is-active"
          type="button"
          data-island="playerIsland"
          data-i18n="page.mainui.islandOptions.playerIsland"
          aria-pressed="true"
        >
          Player Island
        </button>
        <button
          class="island-nav-button"
          type="button"
          data-island="gigasCedar"
          data-i18n="page.mainui.islandOptions.gigasCedar"
          aria-pressed="false"
        >
          Gigas Cedar
        </button>
        <button
          class="island-nav-button"
          type="button"
          data-island="iceCave"
          data-i18n="page.mainui.islandOptions.iceCave"
          aria-pressed="false"
        >
          Ice Cave
        </button>
        <button
          class="island-nav-button"
          type="button"
          data-island="rulid"
          data-i18n="page.mainui.islandOptions.rulid"
          aria-pressed="false"
        >
          Rulid
        </button>
        <button
          class="island-nav-button"
          type="button"
          data-island="fishingIsland"
          data-i18n="page.mainui.islandOptions.fishingIsland"
          aria-pressed="false"
        >
          Fishing Island
        </button>
      </div>
      <div class="header-main">
        <h1 data-i18n="page.mainui.title">SAO Interactive Map</h1>
        <div class="controls">
          <input
            type="text"
            id="search"
            data-i18n-placeholder="page.mainui.searchPlaceholder"
            placeholder="Search markers..."
          />
          <button id="clearFilters" class="control-action" type="button" data-i18n="page.mainui.clearFilters">
            Clear Filters
          </button>
        </div>
      </div>
    </header>

    <div
      id="globalToast"
      class="global-toast"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      aria-hidden="true"
    ></div>

    <main>
      <section id="mapContainer">
        <div id="mapLayer">
          <img id="mapImage" data-i18n-alt="page.maps.mapAlt" alt="Map floor" decoding="async" fetchpriority="high" />
          <img
            id="undergroundMapImage"
            data-i18n-alt="page.maps.undergroundAlt"
            alt="Underground overlay"
            decoding="async"
            fetchpriority="low"
          />
          <svg id="mobAreaLayer" aria-hidden="true"></svg>
          <div id="markers"></div>
          <div id="mapEmptyState" class="map-empty-state" aria-live="polite">
            <div class="map-empty-state-panel">
              <div class="map-empty-state-header" data-i18n="page.mainui.mapDataUnavailableTitle">
                FRACTURED UNDERWORLD MAP
              </div>
              <div class="map-empty-state-body" id="mapEmptyStateLabel" data-i18n="page.mainui.mapDataUnavailableBody">
                Map data is currently being developed.
              </div>
              <div class="map-empty-state-footer" data-i18n="page.mainui.mapDataUnavailableFooter">
                NPC and map data will be added as this module progresses.
              </div>
            </div>
          </div>
        </div>
        <div id="coordinateDisplay">
          <div id="overlayMappedCoords" data-i18n="page.mainui.coordinatesPlaceholder">X: -- Z: --</div>
        </div>
        <div id="zoomControls">
          <button
            id="zoomOut"
            type="button"
            data-polish-zoom="out"
            data-i18n-aria-label="page.maps.zoomOut"
            aria-label="Zoom out"
          >
            −
          </button>
          <button id="resetView" type="button" data-i18n="page.mainui.resetView">Reset View</button>
          <button
            id="zoomIn"
            type="button"
            data-polish-zoom="in"
            data-i18n-aria-label="page.maps.zoomIn"
            aria-label="Zoom in"
          >
            +
          </button>
          <span id="zoomLabel">1x</span>
        </div>
        <div id="infoOverlay">
          <div class="sidebar-section">
            <div class="sidebar-section-title" id="title" data-i18n="page.mainui.defaultInfoTitle">Select a marker</div>
            <div id="content" aria-live="polite" aria-atomic="true">
              <p data-i18n="page.mainui.defaultInfoBody">Choose a marker on the map to see details here.</p>
            </div>
          </div>
        </div>
      </section>

      <div
        id="sidebarResizeHandle"
        role="separator"
        tabindex="0"
        data-i18n-aria-label="page.maps.sidebarResizeAria"
        aria-label="Resize sidebar"
        aria-orientation="vertical"
      ></div>

      <aside id="sidebar">
        <div class="sidebar-section">
          <div class="sidebar-section-title" id="categorySectionHeader" data-i18n="page.mainui.categorySectionHeader">
            PLAYER ISLAND
          </div>
          <ul id="categoryList" class="sidebar-list"></ul>
        </div>
      </aside>
    </main>

    <script src="../../shared/sao-storage.js"></script>

    <script src="../../shared/sao-content-translations.js"></script>
    <script src="../../shared/sao-datasets.js"></script>
    <script src="../../shared/sao-walkthrough.js"></script>
    <script src="../../shared/map-runtime.js"></script>
    <script src="underworldData.js"></script>
    <script src="adapter.js"></script>
    <script src="mainui.js?v=header-layout"></script>
    <script src="../../shared/sao-polish.js"></script>
  </body>
</html>
