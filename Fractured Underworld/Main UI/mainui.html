    }

<body>
  <header>
    <nav class="top-nav" aria-label="Primary">
      <button class="top-button" type="button" data-nav-target="towerDefense" data-i18n="page.mainui.towerDefenseNav">Tower Defense</button>
      <button class="top-button" type="button" data-message="Not enough information released yet to make a page!" data-i18n="page.mainui.compendiumNav">Compendium</button>
      <a class="top-button" href="../../index.html" data-i18n="ui.nav.menu">Go back to Menu</a>
    </nav>
    <div class="header-main">
      <h1 data-i18n="page.mainui.title">SAO Interactive Map</h1>
      <div class="controls">
        <label for="floorSelect" data-i18n="page.mainui.islandLabel">Island:</label>
        <select id="floorSelect">
          <option value="playerIsland" selected data-i18n="page.mainui.islandOptions.playerIsland">Player Island</option>
          <option value="gigasCedar" data-i18n="page.mainui.islandOptions.gigasCedar">Gigas Cedar</option>
          <option value="iceCave" data-i18n="page.mainui.islandOptions.iceCave">Ice Cave</option>
          <option value="rulid" data-i18n="page.mainui.islandOptions.rulid">Rulid</option>
          <option value="fishingIsland" data-i18n="page.mainui.islandOptions.fishingIsland">Fishing Island</option>
        </select>
        <label class="underground-toggle-wrapper" for="undergroundToggle">
          <span data-i18n="page.mainui.undergroundLabel">Underground:</span>
          <input type="checkbox" id="undergroundToggle">
        </label>
        <input type="text" id="search" data-i18n-placeholder="page.mainui.searchPlaceholder" placeholder="Search markers...">
        <button id="clearFilters" class="control-action" type="button" data-i18n="page.mainui.clearFilters">Clear Filters</button>
      </div>
    </div>
  </header>

  <div id="globalToast" class="global-toast" role="status" aria-live="polite" aria-atomic="true" aria-hidden="true"></div>

  <main>
    <section id="mapContainer">
      <div id="mapLayer">
        <img id="mapImage" alt="Map floor" decoding="async" fetchpriority="high">
        <img id="undergroundMapImage" class="underground-map" alt="Underground overlay" decoding="async" fetchpriority="low">
        <svg id="mobAreaLayer" aria-hidden="true"></svg>
        <div id="markers"></div>
      </div>
      <div id="coordinateDisplay">
        <div id="overlayMappedCoords">X: -- Z: --</div>
      </div>
      <div id="zoomControls">
        <button id="resetView" type="button" data-i18n="page.mainui.resetView">Reset View</button>
        <span id="zoomLabel">1x</span>
      </div>
      <div id="infoOverlay">
        <div class="sidebar-section">
          <div class="sidebar-section-title" id="title" data-i18n="page.mainui.defaultInfoTitle">Select a marker</div>
          <div id="content" aria-live="polite" aria-atomic="true">
            <p data-i18n="page.mainui.defaultInfoBody">Choose a marker on the map to see details here.</p>
          </div>
        </div>
      </div>
    </section>

    <div id="sidebarResizeHandle" role="separator" tabindex="0" aria-label="Resize sidebar" aria-orientation="vertical"></div>

    <aside id="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-section-title" data-i18n="page.mainui.categoryMainTitle">Category: Main</div>
        <ul class="sidebar-list">
          <li><button class="sidebar-list-button" type="button" data-category="npc" data-i18n="page.mainui.categories.npc">NPC</button></li>
          <li><button class="sidebar-list-button" type="button" data-category="rulid" data-i18n="page.mainui.categories.rulid">Wheat Spawn</button></li>
          <li><button class="sidebar-list-button" type="button" data-category="fishingSpot" data-i18n="page.mainui.categories.fishingSpot">Fishing Spot</button></li>
          <li><button class="sidebar-list-button" type="button" data-category="oakWood" data-i18n="page.mainui.categories.oakWood">Oak Wood</button></li>
          <li><button class="sidebar-list-button" type="button" data-category="copper" data-i18n="page.mainui.categories.copper">Copper</button></li>
          <li><button class="sidebar-list-button" type="button" data-category="iron" data-i18n="page.mainui.categories.iron">Iron</button></li>
          <li><button class="sidebar-list-button" type="button" data-category="coal" data-i18n="page.mainui.categories.coal">Coal</button></li>
        </ul>
      </div>
    </aside>
  </main>

  <script src="../../shared/sao-storage.js"></script>
  <script src="../../shared/sao-i18n.js"></script>
  <script src="mainui.js"></script>
</body>
</html>
