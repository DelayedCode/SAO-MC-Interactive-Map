    <div class="header-main">
      <h1 data-i18n="page.maps.title">SAO Interactive Map</h1>
      <div class="controls">
        <label for="floorSelect" data-i18n="page.maps.floorLabel">Floor:</label>
        <div class="sao-select-wrap" id="floorSelectWrap">
          <select id="floorSelect">
            <option value="floor1" data-i18n="page.maps.floorOptions.floor1">Floor 1 - The Town of Beginnings</option>
            <option value="floor2" data-i18n="page.maps.floorOptions.floor2">Floor 2 - Arid Desert</option>
            <option value="floor3" data-i18n="page.maps.floorOptions.floor3">Floor 3 - The Forest of Wandering</option>
          </select>
          <span class="sao-select-arrow" aria-hidden="true"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path class="arrow-closed" d="M2 6.5 5 3.5l3 3"/><path class="arrow-open" d="M2 3.5 5 6.5l3-3"/></svg></span>
        </div>
        <label class="underground-toggle-wrapper" for="undergroundToggle">
          <span data-i18n="page.maps.undergroundLabel">Underground:</span>
          <input type="checkbox" id="undergroundToggle">
        </label>
        <input type="text" id="search" data-i18n-placeholder="page.maps.searchPlaceholder" placeholder="Search markers...">
        <button id="clearFilters" class="control-action" type="button" data-i18n="page.maps.clearFilters">Clear Filters</button>
      </div>
    </div>

  <main>
    <section id="mapContainer">
      <div id="mapLayer">
        <img id="mapImage" data-i18n-aria-label="page.maps.mapAlt" data-i18n-alt="page.maps.mapAlt" alt="Map floor" decoding="async" fetchpriority="high">
        <img id="undergroundMapImage" class="underground-map" data-i18n-aria-label="page.maps.undergroundAlt" data-i18n-alt="page.maps.undergroundAlt" alt="Underground overlay" decoding="async" fetchpriority="low">
        <svg id="mobAreaLayer" aria-hidden="true"></svg>
        <div id="markers"></div>
      </div>
      <div id="coordinateDisplay">
        <div id="overlayMappedCoords" data-i18n="page.maps.coordinatesPlaceholder">X: -- Z: --</div>
      </div>
      <div id="zoomControls">
        <button id="resetView" type="button" data-i18n="page.maps.resetView">Reset View</button>
        <span id="zoomLabel">1x</span>
      </div>
      <div id="infoOverlay">
        <div class="sidebar-section">
          <div class="sidebar-section-title" id="title" data-i18n="page.maps.defaultInfoTitle">Select a marker</div>
          <div id="content" aria-live="polite" aria-atomic="true">
            <p data-i18n="page.maps.defaultInfoBody">Choose a marker on the map to see details here.</p>
          </div>
        </div>
      </div>
    </section>

    <div id="sidebarResizeHandle" role="separator" tabindex="0" data-i18n-aria-label="page.maps.sidebarResizeAria" aria-label="Resize sidebar" aria-orientation="vertical"></div>

        <ul class="sidebar-list">
          <li><button class="sidebar-list-button" type="button" data-i18n="page.maps.categories.main">Main Quests</button></li>
          <li><button class="sidebar-list-button" type="button" data-category="sideQuests" data-i18n="page.maps.categories.sideQuests">Side</button></li>
        </ul>
      </div>
      <div class="sidebar-section">

          <li><button class="sidebar-list-button" type="button" data-category="equipmentMerchants" data-i18n="page.maps.categories.equipmentMerchants">Equipment Merchant</button></li>
          <li><button class="sidebar-list-button" type="button" data-category="lootBuyers" data-i18n="page.maps.categories.lootBuyers">Loot Buyers</button></li>
          <li><button class="sidebar-list-button" type="button" data-category="occultMerchants" data-i18n="page.maps.categories.occultMerchants">Occult Merchant</button></li>

          <li><button class="sidebar-list-button" type="button" data-category="armorBlacksmith" data-i18n="page.maps.categories.armorBlacksmith">Armor Blacksmith</button></li>

          <li><button class="sidebar-list-button" type="button" data-category="runeCraftsmen" data-i18n="page.maps.categories.runeCraftsmen">Rune Craftsmen</button></li>
          <li><button class="sidebar-list-button" type="button" data-category="weaponsmith" data-i18n="page.maps.categories.weaponsmith">Weaponsmith</button></li>
