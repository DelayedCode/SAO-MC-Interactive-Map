    <div class="page">

      <div class="panel">
        <p class="eyebrow" data-i18n="page.bestiary.eyebrow">AINCRAD / BESTIARY</p>
        <h1 data-i18n="page.bestiary.heading">Bestiary</h1>
        <div
          class="list-tabs"
          role="tablist"
          data-i18n-aria-label="page.bestiary.tablistAria"
          aria-label="Bestiary categories"
        >
          <button class="list-tab is-active" type="button" data-category="boss" data-i18n="page.bestiary.listTitleBoss">
            Boss List
          </button>
          <button
            class="list-tab"
            type="button"
            data-category="dungeonBoss"
            data-i18n="page.bestiary.listTitleDungeonBoss"
          >
            Dungeon Boss List
          </button>
          <button
            class="list-tab"
            type="button"
            data-category="dungeonMobs"
            data-i18n="page.bestiary.listTitleDungeonMobs"
          >
            Dungeon Mobs List
          </button>
          <button class="list-tab" type="button" data-category="regular" data-i18n="page.bestiary.listTitleRegular">
            Regular Mobs List
          </button>
        </div>
        <div class="panel-header">
          <p id="status" role="status" aria-live="polite" data-i18n="ui.common.loading">Loading...</p>
          <label class="search-label" for="mobSearch">
            <span data-i18n="page.bestiary.searchLabel">Search mobs</span>
            <input
              id="mobSearch"
              type="search"
              data-i18n-placeholder="page.bestiary.searchPlaceholder"
              placeholder="Search by name..."
              autocomplete="off"
            />
          </label>
        </div>
        <h2 id="listTitle" class="list-title" data-i18n="page.bestiary.listTitleRegular">Regular Mobs List</h2>
        <section id="mobList" class="mob-list" aria-live="polite" aria-atomic="true"></section>
      </div>
