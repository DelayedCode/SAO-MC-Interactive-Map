  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", Arial, sans-serif;
      --text: #eef4ff;
      --muted: #b9cce3;
      --line: #3a4a5e;
      --panel: rgba(18, 27, 39, 0.94);
      --panel-2: rgba(26, 38, 53, 0.95);
      --accent: #73b9ff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, rgba(115, 185, 255, 0.12), transparent 24%),
        linear-gradient(180deg, #0d141d 0%, #0b121a 100%);
      color: var(--text);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(15, 22, 32, 0.86);
      border-bottom: 1px solid var(--line);
      gap: 12px;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .title {
      font-size: clamp(1.25rem, 2.2vw, 1.6rem);
      font-weight: 700;
      line-height: 1.15;
    }

    .topbar button {
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid rgba(130, 190, 255, 0.26);
      border-radius: 10px;
      background: rgba(23, 35, 50, 0.92);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
    }

    .topbar button:hover {
      background: rgba(30, 47, 68, 0.98);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .topbar button:active {
      transform: translateY(0) scale(0.98);
    }

    .topbar button:focus-visible,
    .menu-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .content {
      max-width: 1100px;
      margin: 0 auto;
      padding: 22px 18px;
    }

    .button-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 980px;
    }

    .menu-button {
      width: 100%;
      text-align: left;
      padding: 14px 16px;
      border: 1px solid rgba(130, 190, 255, 0.24);
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: border-color 0.16s ease, background 0.16s ease, transform 0.16s ease;
    }

    .menu-button:hover {
      background: rgba(38, 56, 78, 0.98);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .menu-button:active {
      transform: translateY(0) scale(0.98);
    }

    .details {
      margin-top: 10px;
      padding: 14px 16px;
      border: 1px solid rgba(130, 190, 255, 0.2);
      border-radius: 12px;
      background: var(--panel);
      color: var(--muted);
      line-height: 1.7;
      white-space: pre-line;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
    }

    @media (max-width: 680px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .topbar button {
        width: 100%;
      }

      .content {
        padding: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .topbar button:hover,
      .menu-button:hover {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1 class="title" data-i18n="page.miscinfo.heading">Misc. Info</h1>
    <button id="backToMapButton" type="button" data-i18n="page.miscinfo.back">Go back to Menu</button>
  </header>

  <main class="content">
    <div class="button-list">
      <button class="menu-button" id="playerLevelsButton" type="button" data-i18n="page.miscinfo.playerLevels" aria-expanded="false" aria-controls="playerLevelsDetails">Player Levels</button>
      <div class="details" id="playerLevelsDetails" hidden aria-live="polite" aria-atomic="true" data-i18n="page.miscinfo.playerLevelsDetails">Level 1 -> 2: 150 XP</div>
    </div>
  </main>

  <script src="../../shared/sao-storage.js"></script>
  <script src="../../shared/sao-i18n.js"></script>
  <script>
    const backToMapButton = document.getElementById("backToMapButton");
    backToMapButton.addEventListener("click", () => {
      window.location.href = "../../index.html";
    });

    const playerLevelsButton = document.getElementById("playerLevelsButton");
    const playerLevelsDetails = document.getElementById("playerLevelsDetails");

    playerLevelsButton.addEventListener("click", () => {
      const isHidden = playerLevelsDetails.hasAttribute("hidden");
      if (isHidden) {
        playerLevelsDetails.removeAttribute("hidden");
        playerLevelsButton.setAttribute("aria-expanded", "true");
      } else {
        playerLevelsDetails.setAttribute("hidden", "hidden");
        playerLevelsButton.setAttribute("aria-expanded", "false");
      }
    });
  </script>
</body>
</html>
