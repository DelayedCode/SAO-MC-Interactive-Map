<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page.quests.title">SAO Quests</title>
    <link rel="icon" type="image/svg+xml" href="quest-logo.svg?v=2" />
    <link rel="stylesheet" href="quests.css" />
    <link rel="stylesheet" href="../../shared/aincrad-ui.css" />
    <link rel="stylesheet" href="../../shared/sao-polish.css" />
  </head>
  <body>
    <div class="page">
      <div class="nav">
        <button type="button" data-nav-target="maps" data-i18n="ui.nav.maps">Map</button>
        <button type="button" data-nav-target="bestiary" data-i18n="ui.nav.bestiary">Bestiary</button>
        <button type="button" data-nav-target="equipment" data-i18n="ui.nav.equipment">Equipment</button>
        <button type="button" data-nav-target="patchnotes" data-i18n="ui.nav.patchnotes">Patchnotes</button>
        <button type="button" data-nav-target="miscinfo" data-i18n="ui.nav.miscinfo">Misc. Info</button>
        <button type="button" data-nav-target="menu">
          <span class="nav-icon" aria-hidden="true"
            ><svg
              class="nav-icon-arrow"
              viewBox="0 0 12 12"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M10 6H2M2 6l4-4M2 6l4 4" /></svg></span
          ><span data-i18n="ui.nav.menu">Go back to Menu</span>
        </button>
      </div>
      <div class="panel">
        <p class="eyebrow" data-i18n="page.quests.eyebrow">AINCRAD / QUESTS</p>
        <h1 class="quests-title">
          <svg
            class="quests-logo"
            viewBox="0 0 64 64"
            role="img"
            data-i18n-aria-label="page.quests.logoAria"
            aria-label="Quests logo"
          >
            <defs>
              <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#3b7b57" />
                <stop offset="100%" stop-color="#1d4732" />
              </linearGradient>
              <linearGradient id="scroll" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f4ecd1" />
                <stop offset="100%" stop-color="#dacfa7" />
              </linearGradient>
            </defs>
            <path
              d="M32 4l22 10v16c0 16-9.6 24.9-22 30C19.6 54.9 10 46 10 30V14z"
              fill="url(#shield)"
              stroke="#9fdbb8"
              stroke-width="2"
            />
            <path d="M42 17l3 2-21 28-3-2z" fill="#f0f7f2" opacity="0.9" />
            <path d="M39 15l5 4 2-2-5-4z" fill="#bfd6c6" />
            <rect x="17" y="19" width="25" height="20" rx="3" fill="url(#scroll)" stroke="#9d8d62" stroke-width="1.3" />
            <path d="M21 24h17M21 28h13M21 32h15" stroke="#8b7c53" stroke-width="1.6" stroke-linecap="round" />
            <circle cx="44" cy="44" r="10" fill="#2e8f5c" stroke="#d9ffe9" stroke-width="1.8" />
            <path
              d="M39.5 44l3.3 3.5 6-6.6"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span data-i18n="page.quests.heading">Quests</span>
        </h1>
        <div class="panel-header">
          <p id="status" data-i18n="ui.common.loading">Loading...</p>
          <label class="search-label" for="questSearch">
            <span data-i18n="page.quests.searchLabel">Search quests</span>
            <input
              id="questSearch"
              type="search"
              data-i18n-placeholder="page.quests.searchPlaceholder"
              placeholder="Search by any column..."
              autocomplete="off"
            />
          </label>
        </div>
        <div
          class="quest-type-filter"
          role="group"
          data-i18n-aria-label="page.quests.questTypeFilterAria"
          aria-label="Quest type filter"
        >
          <button
            type="button"
            class="quest-type-button"
            data-quest-type="main"
            data-i18n="page.quests.questTypes.main"
          >
            Main Quests
          </button>
          <button
            type="button"
            class="quest-type-button is-active"
            data-quest-type="side"
            data-i18n="page.quests.questTypes.side"
          >
            Side Quests
          </button>
        </div>
        <div
          class="quest-filter-row"
          role="group"
          data-i18n-aria-label="page.quests.questFiltersAria"
          aria-label="Quest filters"
        >
          <label class="quest-filter-field" for="questCityFilter">
            <span data-i18n="page.quests.cityFilterLabel">City</span>
            <select id="questCityFilter">
              <option value="" data-i18n="page.quests.allCities">All cities</option>
            </select>
          </label>
          <label class="quest-filter-field" for="questCompletionFilter">
            <span data-i18n="page.quests.completionFilterLabel">Completion</span>
            <select id="questCompletionFilter">
              <option value="" data-i18n="page.quests.allQuests">All quests</option>
              <option value="completed" data-i18n="page.quests.completedOnly">Completed only</option>
              <option value="incomplete" data-i18n="page.quests.incompleteOnly">Not completed</option>
            </select>
          </label>
        </div>
        <div id="questTableRoot"></div>
      </div>
    </div>
    <script src="../../shared/sao-storage.js"></script>
    <script src="../../shared/sao-page-utils.js"></script>
    <script src="../../shared/sao-i18n.js?v=quest-filters"></script>
    <script src="../../shared/sao-page-helpers.js"></script>
    <script src="../../shared/sao-content-translations.js"></script>
    <script src="../../shared/sao-datasets.js"></script>
    <script src="../../shared/sao-runtime-utils.js"></script>
    <script src="quests_current.js"></script>
    <script src="quests.js"></script>
    <script src="../../shared/sao-polish.js"></script>
  </body>
</html>
